name: Keepalive backend

# Render Free duerme el servicio tras 15 min sin tráfico. Un ping cada 14 min lo
# mantiene despierto (un solo servicio entra en las 750 h/mes del plan).
# /api/health no consulta la base: no evita que Supabase Free pause el proyecto.
on:
  schedule:
    - cron: "*/14 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    if: vars.API_BASE_URL != ''
    steps:
      - name: Ping health
        run: curl -fsS --max-time 90 --retry 2 "${{ vars.API_BASE_URL }}/api/health"
