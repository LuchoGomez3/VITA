[alembic]
script_location = %(here)s/alembic
path_separator = os

# env.py reemplaza este valor con DATABASE_URL/POSTGRES_URI. Se conserva un
# valor local sin credenciales reales para que Alembic pueda cargar el archivo.
sqlalchemy.url = postgresql+asyncpg://postgres:postgres@localhost:5432/vita

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
