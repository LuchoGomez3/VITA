[project]
name = "mc-backend"
version = "0.1.0"
description = "Backend API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.116.1",
    "httpx>=0.28.1",
    "pydantic>=2.11.9",
    "pydantic[email]>=2.11.9",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "python-dotenv>=1.1.1",
    "python-jose>=3.5.0",
    "python-multipart>=0.0.29",
    "sqlmodel>=0.0.22",
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    "greenlet>=3.0",
    "trio>=0.31.0",
    "uvicorn>=0.35.0",
    "supabase>=2.9.0",
    "reportlab>=4.2.0",
    "itsdangerous>=2.2.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.20.0",
    "ruff>=0.8.0",
    "pytest-cov>=6.0.0",
    "alembic>=1.14.0",
]

[tool.pytest.ini_options]
addopts = "-q"
markers = [
    "anyio: mark test to run with anyio",
]
[tool.anyio]
backend = ["asyncio"]

[tool.setuptools]
packages = ["api", "core"]
